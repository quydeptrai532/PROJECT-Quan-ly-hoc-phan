# Cấu hình môi trường sản xuất (PROD) - QLSV-101 (TASK-OP-07A) & QLSV-102 (TASK-OP-07B)
# Vô hiệu hóa Swagger UI và OpenAPI Docs để ngăn chặn việc lộ cấu trúc nội bộ hệ thống
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Rate limiting phân tán qua MySQL để bảo vệ khi triển khai multi-instance / clustering
app:
  rate-limiting:
    strategy: ${RATE_LIMITING_STRATEGY:DATABASE}

