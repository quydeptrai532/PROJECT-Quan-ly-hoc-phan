spring:
  datasource:
    url: jdbc:h2:mem:quan_ly_dao_tao;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  seed:
    enabled: true
  rate-limiting:
    enabled: true
    strategy: IN_MEMORY
    login:
      capacity: 10000
      window-seconds: 60
    api:
      capacity: 50000
      window-seconds: 60
